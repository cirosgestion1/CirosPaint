name: Inspect reconstructed source

on:
  push:
    branches: [build/verify-0.10.1-inspect]
  pull_request:
    branches: [build/verify-0.10.1]

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild consolidated 0.9 source
        shell: pwsh
        run: |
          function Rebuild-Zip($pattern, $expectedCount, $output, $expectedHash) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -ne $expectedCount) { throw "Unexpected chunk count for ${pattern}: $($parts.Count)" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($output, [Convert]::FromBase64String($b64))
            $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expectedHash) { throw "Hash mismatch for ${output}: $hash" }
          }
          Rebuild-Zip 'source/v0.6/chunks/part*.txt' 7 'source/CirosPaint_0.6.zip' '6e49c42e7d3ccfcf219ea24f164a8c436c7875eb56084318242dcb3171337b94'
          New-Item -ItemType Directory -Force build_source | Out-Null
          tar -xf source/CirosPaint_0.6.zip -C build_source
          Rebuild-Zip 'patches/v0.7/chunks/part*.txt' 5 'patches/CirosPaint_0.7.zip' 'aa0d1fc99b0770425081f0e18cbb399440cab77768ea36887d33038947721620'
          tar -xf patches/CirosPaint_0.7.zip -C build_source
          Rebuild-Zip 'patches/v0.8/chunks/part*.txt' 4 'patches/CirosPaint_0.8.zip' 'b30570d26f44aa0e5bf2727910396628e4ab8fc646ddacd49527991cde8d3b90'
          tar -xf patches/CirosPaint_0.8.zip -C build_source
          Rebuild-Zip 'patches/v0.8-artfix/chunks/part*.txt' 1 'patches/CirosPaint_0.8_artfix.zip' '3947092144570548e962b354ec0b7d6fa7b1f6416a2e0fbafa656b450945cbad'
          tar -xf patches/CirosPaint_0.8_artfix.zip -C build_source
          Rebuild-Zip 'patches/v0.8.1/chunks/part*.txt' 9 'patches/CirosPaint_0.8.1.zip' 'ed47500df62010bb9d9f5fb26d09b1174a84787eb80d50c3251db3d433d7ce02'
          tar -xf patches/CirosPaint_0.8.1.zip -C build_source
          git apply --directory=build_source patches/v0.8.2/CirosPaint_0.8.2.patch
          Rebuild-Zip 'patches/v0.8.3/chunks/part*.txt' 12 'patches/CirosPaint_0.8.3_overlay.zip' '185e2b09264544498de8da2d73e5f2c148b0a57b3fec6437bd7c22676b5b7dd9'
          tar -xf patches/CirosPaint_0.8.3_overlay.zip -C build_source
          Push-Location build_source
          python tools/apply_v083_metadata.py
          Pop-Location
          $dashboardPath = 'build_source/app/ui/pages/dashboard_page.py'
          $dashboard = Get-Content $dashboardPath -Raw
          $dashboard = $dashboard.Replace('Ciros Paint 0.8.3.3', 'Ciros Paint 0.8.3.1')
          Set-Content $dashboardPath $dashboard -Encoding utf8
          Rebuild-Zip 'patches/v0.9.0/code_overlay/part*.txt' 5 'patches/CirosPaint_0.9.0_code_overlay.zip' '7dd1878ef496db816313474e55312da775cd505a4da571c68c6a5767d62272f3'
          tar -xf patches/CirosPaint_0.9.0_code_overlay.zip -C build_source
          Copy-Item 'patches/v0.9.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.1/apply_v091.py build_source
          Copy-Item 'patches/v0.9.2/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.2/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.2/apply_v092.py build_source
          Copy-Item 'patches/v0.9.3/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.3/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.3/apply_v093.py build_source
          Copy-Item 'patches/v0.9.4/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.4/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.4/apply_v094.py build_source
          Copy-Item 'patches/v0.9.4.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.4.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.4.1/apply_v0941.py build_source
      - name: Print relevant source
        shell: pwsh
        run: |
          foreach ($path in @(
            'build_source/app/models/library.py',
            'build_source/app/core/color_math.py',
            'build_source/app/constants/catalog.py',
            'build_source/app/repositories/paint_repository.py',
            'build_source/app/repositories/library_repository.py',
            'build_source/app/services/paint_catalog_service.py'
          )) {
            Write-Host "`n===== $path ====="
            Get-Content $path -Raw
          }
          Write-Host "`n===== PAINT TYPE REFERENCES ====="
          Select-String -Path 'build_source/app/ui/pages/paints_page.py','build_source/app/ui/dialogs/paint_dialog.py' -Pattern 'paint_type|PAINT_TYPE|Acrílico|Shade|Wash|Esmalte|Tinta|Óleo|Oleo' -Context 1,2 | ForEach-Object { $_.ToString() }
