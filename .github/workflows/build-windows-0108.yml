name: Build Windows EXE 0.10.8

on:
  workflow_dispatch:
  push:
    branches: [build/verify-0.10.8]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Ciros Paint and apply 0.10.8
        shell: pwsh
        run: |
          $yaml = Get-Content '.github/workflows/build-windows.yml' -Raw
          $pattern = '(?ms)^      - name: Rebuild Ciros Paint and apply 0\.10\.7\r?\n        shell: pwsh\r?\n        run: \|\r?\n(?<script>.*?)(?=^      - name: Set up paint catalog and dependencies)'
          $match = [regex]::Match($yaml, $pattern)
          if (-not $match.Success) { throw 'Could not extract the validated 0.10.7 reconstruction step' }
          $script = ($match.Groups['script'].Value -split "`r?`n" | ForEach-Object {
            if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ }
          }) -join "`n"
          Invoke-Expression $script

          function Rebuild-Zip($pattern, $expectedCount, $output, $expectedHash) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -ne $expectedCount) { throw "Unexpected chunk count for ${pattern}: $($parts.Count)" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($output, [Convert]::FromBase64String($b64))
            $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expectedHash) { throw "Hash mismatch for ${output}: $hash" }
            Write-Host "Verified $output $hash"
          }

          Rebuild-Zip 'patches/v0.10.8/chunks/part*.txt' 6 'patches/CirosPaint_0.10.8_overlay.zip' 'd85dc1f7c9b168890f9f03d4f5973979fbafe73ff2712fbf7428d628ce09e860'
          tar -xf patches/CirosPaint_0.10.8_overlay.zip -C build_source
          python patches/v0.10.8/apply_v0108.py build_source

          python -c "from pathlib import Path; ns={}; exec(Path('build_source/app/core/config.py').read_text(encoding='utf-8'), ns); assert ns['APP_VERSION']=='0.10.8'; r=Path('build_source/app/services/assistant_entity_resolver.py').read_text(encoding='utf-8'); assert 'LocalEntityResolver' in r; w=Path('build_source/app/services/assistant_workflow_service.py').read_text(encoding='utf-8'); assert 'AssistantWorkflowEngine' in w; g=Path('build_source/app/services/assistant_gemini_service.py').read_text(encoding='utf-8'); assert 'resolve_paint_name' in g and 'increment_gemini_request_count' in g; a=Path('build_source/app/ui/pages/assistant_page.py').read_text(encoding='utf-8'); assert 'Cambiar otra miniatura' in a and 'PaintResolveTask' in a and 'owned_only=True' in a; print('Ciros Paint 0.10.8 overlay verified')"

      - name: Set up paint catalog and dependencies
        shell: pwsh
        run: |
          git init catalog_source
          git -C catalog_source remote add origin https://github.com/Arcturus5404/miniature-paints.git
          git -C catalog_source fetch --depth 1 origin 22791a682e1d155da388f4f856cd7196cd9f2677
          git -C catalog_source checkout FETCH_HEAD
          New-Item -ItemType Directory -Force build_source/app/assets/brands | Out-Null
          Copy-Item catalog_source/logos/Vallejo.png build_source/app/assets/brands/vallejo.png
          Copy-Item catalog_source/logos/AK.png build_source/app/assets/brands/ak_interactive.png
          Copy-Item catalog_source/logos/Citadel_Colour.png build_source/app/assets/brands/citadel.png
          cd build_source
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -c "from google import genai; import google.genai; c=genai.Client(api_key='AQ.fake-ciros-paint'); assert callable(c.interactions.create); c.close(); print('google-genai', getattr(google.genai,'__version__','unknown'), 'Interactions API available')"

      - name: Build catalogs and verify assets
        shell: pwsh
        working-directory: build_source
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python tools/build_paint_catalog.py "$env:GITHUB_WORKSPACE\catalog_source" app/data/paint_catalog.json
          python tools/download_miniature_assets.py
          python -c "import json,pathlib; p=json.loads(pathlib.Path('app/data/paint_catalog.json').read_text(encoding='utf-8')); m=json.loads(pathlib.Path('app/data/miniature_catalog.json').read_text(encoding='utf-8')); assert len(p)>500; assert all(isinstance(x.get('lab'),list) and len(x['lab'])==3 for x in p); assert m.get('catalog_revision')=='0.8.1'; assert sum(len(f['units']) for g in m['games'] for f in g['factions'])>500; print('Catalogs and Lab metadata OK')"

      - name: Run tests
        shell: pwsh
        working-directory: build_source
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -v

      - name: Functional assistant UI smoke test
        shell: pwsh
        working-directory: build_source
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONPATH = (Get-Location).Path
          python -c "from PySide6.QtWidgets import QApplication,QLineEdit; app=QApplication([]); from app.core.config import APP_VERSION; assert APP_VERSION=='0.10.8'; from app.ui.pages.assistant_page import AssistantPage; p=AssistantPage(); assert p.send_button.text()=='Enviar' and not p.busy; from app.ui.pages.settings_page import SettingsPage; s=SettingsPage(); assert s.gemini_api_key_input.echoMode()==QLineEdit.Password and 'Requests Gemini del día' in s.gemini_request_count.text(); from app.services.assistant_gemini_service import GeminiAssistantService; tools=GeminiAssistantService._gemini_tool_declarations(); assert len(tools)==7 and all(t['type']=='function' for t in tools); p.close(); s.close(); print('Ciros Paint 0.10.8 assistant smoke test OK')"

      - name: Build CirosPaint_0.10.8.exe
        shell: pwsh
        working-directory: build_source
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CirosPaint --collect-all google.genai --add-data "app/data/paint_catalog.json;app/data" --add-data "app/data/miniature_catalog.json;app/data" --add-data "app/assets/brands;app/assets/brands" --add-data "app/assets/miniatures;app/assets/miniatures" --add-data "app/assets/favorites;app/assets/favorites" --add-data "THIRD_PARTY_NOTICES.txt;." --add-data "MINIATURE_ASSET_SOURCES.md;." main.py
          if (!(Test-Path 'dist/CirosPaint.exe')) { throw 'CirosPaint.exe was not generated' }
          Move-Item 'dist/CirosPaint.exe' 'dist/CirosPaint_0.10.8.exe'
          if (!(Test-Path 'dist/CirosPaint_0.10.8.exe')) { throw 'CirosPaint_0.10.8.exe was not generated' }
          Get-Item dist/CirosPaint_0.10.8.exe | Format-List Name,Length,FullName
          $exeHash = (Get-FileHash 'dist/CirosPaint_0.10.8.exe' -Algorithm SHA256).Hash.ToLower()
          Write-Host "CirosPaint_0.10.8.exe SHA256: $exeHash"

      - uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-Windows-0.10.8
          path: build_source/dist/CirosPaint_0.10.8.exe
          if-no-files-found: error
          retention-days: 30
