name: Export reconstructed source

on:
  push:
    branches: [build/verify-0.10.8]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reuse official reconstruction step
        shell: pwsh
        run: |
          $yaml = Get-Content '.github/workflows/build-windows.yml' -Raw
          $pattern = '(?ms)^      - name: Rebuild Ciros Paint and apply 0\.10\.7\r?\n        shell: pwsh\r?\n        run: \|\r?\n(?<script>.*?)(?=^      - name: Set up paint catalog and dependencies)'
          $match = [regex]::Match($yaml, $pattern)
          if (-not $match.Success) { throw 'Could not extract the official reconstruction step' }
          $script = ($match.Groups['script'].Value -split "`r?`n" | ForEach-Object {
            if ($_.StartsWith('          ')) { $_.Substring(10) } else { $_ }
          }) -join "`n"
          Invoke-Expression $script
          if (!(Test-Path 'build_source/app')) { throw 'Reconstructed source was not produced' }

      - name: Package reconstructed source
        shell: pwsh
        run: |
          Compress-Archive -Path build_source\* -DestinationPath CirosPaint-source-0.10.7.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-source-0.10.7
          path: CirosPaint-source-0.10.7.zip
          if-no-files-found: error
          retention-days: 1
