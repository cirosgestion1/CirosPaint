name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [build/verify-0.9.4]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Ciros Paint 0.9.3 base and apply 0.9.4
        shell: pwsh
        run: |
          function Rebuild-Zip($pattern, $expectedCount, $output, $expectedHash) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -ne $expectedCount) { throw "Unexpected chunk count for ${pattern}: $($parts.Count)" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($output, [Convert]::FromBase64String($b64))
            $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expectedHash) { throw "Hash mismatch for ${output}: $hash" }
            Write-Host "Verified $output $hash"
          }

          Rebuild-Zip 'source/v0.6/chunks/part*.txt' 7 'source/CirosPaint_0.6.zip' '6e49c42e7d3ccfcf219ea24f164a8c436c7875eb56084318242dcb3171337b94'
          New-Item -ItemType Directory -Force build_source | Out-Null
          tar -xf source/CirosPaint_0.6.zip -C build_source

          Rebuild-Zip 'patches/v0.7/chunks/part*.txt' 5 'patches/CirosPaint_0.7.zip' 'aa0d1fc99b0770425081f0e18cbb399440cab77768ea36887d33038947721620'
          tar -xf patches/CirosPaint_0.7.zip -C build_source

          Rebuild-Zip 'patches/v0.8/chunks/part*.txt' 4 'patches/CirosPaint_0.8.zip' 'b30570d26f44aa0e5bf2727910396628e4ab8fc646ddacd49527991cde8d3b90'
          tar -xf patches/CirosPaint_0.8.zip -C build_source

          Rebuild-Zip 'patches/v0.8-artfix/chunks/part*.txt' 1 'patches/CirosPaint_0.8_artfix.zip' '3947092144570548e962b354ec0b7d6fa7b1f6416a2e0fbafa656b450945cbad'
          tar -xf patches/CirosPaint_0.8_artfix.zip -C build_source

          Rebuild-Zip 'patches/v0.8.1/chunks/part*.txt' 9 'patches/CirosPaint_0.8.1.zip' 'ed47500df62010bb9d9f5fb26d09b1174a84787eb80d50c3251db3d433d7ce02'
          tar -xf patches/CirosPaint_0.8.1.zip -C build_source

          python -c "from pathlib import Path; p=Path(r'patches/v0.8.2/CirosPaint_0.8.2.patch'); p.write_bytes(p.read_text(encoding='utf-8').encode('utf-8'))"
          git apply --directory=build_source patches/v0.8.2/CirosPaint_0.8.2.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply Ciros Paint 0.8.2 patch' }

          Rebuild-Zip 'patches/v0.8.3/chunks/part*.txt' 12 'patches/CirosPaint_0.8.3_overlay.zip' '185e2b09264544498de8da2d73e5f2c148b0a57b3fec6437bd7c22676b5b7dd9'
          tar -xf patches/CirosPaint_0.8.3_overlay.zip -C build_source
          Push-Location build_source
          python tools/apply_v083_metadata.py
          Pop-Location

          $dashboardPath = 'build_source/app/ui/pages/dashboard_page.py'
          $dashboard = Get-Content $dashboardPath -Raw
          $dashboard = $dashboard.Replace('Ciros Paint 0.8.3.3', 'Ciros Paint 0.8.3.1')
          Set-Content $dashboardPath $dashboard -Encoding utf8

          Rebuild-Zip 'patches/v0.9.0/code_overlay/part*.txt' 5 'patches/CirosPaint_0.9.0_code_overlay.zip' '7dd1878ef496db816313474e55312da775cd505a4da571c68c6a5767d62272f3'
          tar -xf patches/CirosPaint_0.9.0_code_overlay.zip -C build_source

          Copy-Item 'patches/v0.9.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.1/apply_v091.py build_source

          Copy-Item 'patches/v0.9.2/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.2/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.2/apply_v092.py build_source

          Copy-Item 'patches/v0.9.3/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.3/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.3/apply_v093.py build_source

          Copy-Item 'patches/v0.9.4/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.4/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.4/apply_v094.py build_source

          python -c "from pathlib import Path; ns={}; exec(Path('build_source/app/core/config.py').read_text(encoding='utf-8'), ns); assert ns['APP_VERSION']=='0.9.4'; p=Path('build_source/app/ui/dialogs/youtube_player_dialog.py').read_text(encoding='utf-8'); assert 'LoopbackPlayerServer' in p and 'http://localhost:' in p and 'self.web.load(self._player_server.url)' in p; y=Path('build_source/app/services/youtube_service.py').read_text(encoding='utf-8'); assert 'build_language_search_plan' in y and 'defaultAudioLanguage' in y; q=Path('build_source/app/services/tutorial_query_service.py').read_text(encoding='utf-8'); assert 'language_search_plan' in q and 'localized_search_query' in q; u=Path('build_source/app/ui/pages/tutorial_search_page.py').read_text(encoding='utf-8'); assert 'TutorialLanguageTag' in u and 'language_badge' in u; print('Ciros Paint 0.9.4 overlay verified')"

      - name: Set up paint catalog and dependencies
        shell: pwsh
        run: |
          git init catalog_source
          git -C catalog_source remote add origin https://github.com/Arcturus5404/miniature-paints.git
          git -C catalog_source fetch --depth 1 origin 22791a682e1d155da388f4f856cd7196cd9f2677
          git -C catalog_source checkout FETCH_HEAD
          New-Item -ItemType Directory -Force build_source/app/assets/brands | Out-Null
          Copy-Item catalog_source/logos/Vallejo.png build_source/app/assets/brands/vallejo.png
          Copy-Item catalog_source/logos/AK.png build_source/app/assets/brands/ak_interactive.png
          Copy-Item catalog_source/logos/Citadel_Colour.png build_source/app/assets/brands/citadel.png
          cd build_source
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build catalogs and verify assets
        shell: pwsh
        working-directory: build_source
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python tools/build_paint_catalog.py "$env:GITHUB_WORKSPACE\catalog_source" app/data/paint_catalog.json
          python tools/download_miniature_assets.py
          python -c "import json,pathlib; p=json.loads(pathlib.Path('app/data/paint_catalog.json').read_text(encoding='utf-8')); m=json.loads(pathlib.Path('app/data/miniature_catalog.json').read_text(encoding='utf-8')); assert len(p)>500; assert m.get('catalog_revision')=='0.8.1'; assert sum(len(f['units']) for g in m['games'] for f in g['factions'])>500; print('Catalogs OK')"
          if (!(Test-Path 'app/assets/favorites/miniatures.svg')) { throw 'Miniaturas favorites banner missing' }
          if (!(Test-Path 'app/assets/favorites/modeling_general.svg')) { throw 'Modelismo general favorites banner missing' }

      - name: Run tests
        shell: pwsh
        working-directory: build_source
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -v

      - name: UI and loopback smoke test
        shell: pwsh
        working-directory: build_source
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONPATH = (Get-Location).Path
          python -c "from urllib.request import urlopen; from PySide6.QtWidgets import QApplication; app=QApplication([]); from app.core.config import APP_VERSION; assert APP_VERSION=='0.9.4'; from app.ui.pages.tutorial_search_page import TutorialSearchPage,_language_badge; from app.services.youtube_service import TutorialVideo,build_language_search_plan; p=TutorialSearchPage(); assert [p.language_filter.itemText(i) for i in range(p.language_filter.count())]==['Todos','Español','Inglés']; plan=build_language_search_plan('pintar Darth Vader',''); assert [x[1] for x in plan]==['es','en']; assert 'pintar' in plan[0][0] and 'paint' in plan[1][0]; v=TutorialVideo('dQw4w9WgXcQ','How to paint Darth Vader','Test','','','https://www.youtube.com/watch?v=dQw4w9WgXcQ','1:00','2026-01-01T00:00:00Z',1,1,language_code='en'); b=_language_badge(v); assert b.text()=='EN' and b.toolTip()=='Inglés'; from app.ui.dialogs.youtube_player_dialog import LoopbackPlayerServer; s=LoopbackPlayerServer('dQw4w9WgXcQ'); s.start(); r=urlopen(s.url.toString(),timeout=3); h=r.read().decode('utf-8'); assert 'youtube.com/embed/dQw4w9WgXcQ' in h and r.headers.get('Referrer-Policy')=='strict-origin-when-cross-origin'; s.stop(); print('Ciros Paint 0.9.4 UI/loopback smoke test OK')"

      - name: Build CirosPaint_0.9.4.exe
        shell: pwsh
        working-directory: build_source
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CirosPaint --add-data "app/data/paint_catalog.json;app/data" --add-data "app/data/miniature_catalog.json;app/data" --add-data "app/assets/brands;app/assets/brands" --add-data "app/assets/miniatures;app/assets/miniatures" --add-data "app/assets/favorites;app/assets/favorites" --add-data "THIRD_PARTY_NOTICES.txt;." --add-data "MINIATURE_ASSET_SOURCES.md;." main.py
          if (!(Test-Path 'dist/CirosPaint.exe')) { throw 'CirosPaint.exe was not generated' }
          Move-Item 'dist/CirosPaint.exe' 'dist/CirosPaint_0.9.4.exe'
          if (!(Test-Path 'dist/CirosPaint_0.9.4.exe')) { throw 'CirosPaint_0.9.4.exe was not generated' }
          $exeHash = (Get-FileHash 'dist/CirosPaint_0.9.4.exe' -Algorithm SHA256).Hash.ToLower()
          Write-Host "CirosPaint_0.9.4.exe SHA256: $exeHash"

      - uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-Windows-0.9.4
          path: build_source/dist/CirosPaint_0.9.4.exe
          if-no-files-found: error
          retention-days: 30
