name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify Ciros Paint 0.3 source
        shell: pwsh
        run: |
          $b64 = (Get-Content 'source/v0.3/CirosPaint_0.3_source.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('source/CirosPaint_0.3.rebuilt.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'source/CirosPaint_0.3.rebuilt.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '43d0a33cb1c18c10ccb13feb302a2e841afbdfabb1f8d53b6a1a48956d9e4190') {
            throw "Source ZIP hash mismatch: $hash"
          }
          Write-Host "Verified source SHA256: $hash"

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_source | Out-Null
          tar -xf source/CirosPaint_0.3.rebuilt.zip -C build_source

      - name: Set up paint catalog source
        shell: pwsh
        run: |
          git init catalog_source
          git -C catalog_source remote add origin https://github.com/Arcturus5404/miniature-paints.git
          git -C catalog_source fetch --depth 1 origin 22791a682e1d155da388f4f856cd7196cd9f2677
          git -C catalog_source checkout FETCH_HEAD

      - name: Install dependencies
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build embedded paint catalog
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python tools/build_paint_catalog.py "$env:GITHUB_WORKSPACE\catalog_source" app/data/paint_catalog.json
          python -c "import json, pathlib; p=pathlib.Path('app/data/paint_catalog.json'); d=json.loads(p.read_text(encoding='utf-8')); assert len(d) > 500; assert any(x['brand']=='Vallejo' and x['name']=='Ice Yellow' and x['code']=='70.858' for x in d); print('Catalog entries:', len(d))"

      - name: Run tests
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -v

      - name: Build CirosPaint.exe
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CirosPaint --add-data "app/data/paint_catalog.json;app/data" --add-data "THIRD_PARTY_NOTICES.txt;." main.py

      - name: Smoke-check executable exists
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          if (-not (Test-Path 'dist/CirosPaint.exe')) { throw 'CirosPaint.exe was not generated.' }
          Get-Item 'dist/CirosPaint.exe' | Format-List Name,Length,FullName

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-Windows-0.3
          path: build_source/CirosPaint/dist/CirosPaint.exe
          if-no-files-found: error
          retention-days: 30
