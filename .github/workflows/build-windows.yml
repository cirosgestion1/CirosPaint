name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild verified 0.2 source base
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'source/chunks/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('source/CirosPaint_0.2.rebuilt.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'source/CirosPaint_0.2.rebuilt.zip' -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '24ef8b40eb40081ff486adbf8839795ea92796154e65a0d50cb7bb0dd2b1550e') {
            throw "Source ZIP hash mismatch: $hash"
          }
          Write-Host "Verified base source SHA256: $hash"

      - name: Extract source base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_source | Out-Null
          tar -xf source/CirosPaint_0.2.rebuilt.zip -C build_source

      - name: Apply Ciros Paint 0.3 patches
        shell: pwsh
        run: |
          robocopy "$env:GITHUB_WORKSPACE\patches\v0.3" "$env:GITHUB_WORKSPACE\build_source\CirosPaint" /E /NFL /NDL /NJH /NJS /NC /NS /NP
          if ($LASTEXITCODE -ge 8) { throw "Robocopy failed with exit code $LASTEXITCODE" }
          $path = "$env:GITHUB_WORKSPACE\build_source\CirosPaint\app\ui\main_window.py"
          (Get-Content $path -Raw).Replace('v0.2 · Local','v0.3 · Local') | Set-Content $path -Encoding utf8
          $path = "$env:GITHUB_WORKSPACE\build_source\CirosPaint\app\ui\pages\dashboard_page.py"
          (Get-Content $path -Raw).Replace('Ciros Paint 0.2','Ciros Paint 0.3') | Set-Content $path -Encoding utf8
          $path = "$env:GITHUB_WORKSPACE\build_source\CirosPaint\app\ui\pages\assistant_page.py"
          (Get-Content $path -Raw).Replace('En 0.2 esta pantalla','En 0.3 esta pantalla') | Set-Content $path -Encoding utf8

      - name: Set up paint catalog source
        shell: pwsh
        run: |
          git init catalog_source
          git -C catalog_source remote add origin https://github.com/Arcturus5404/miniature-paints.git
          git -C catalog_source fetch --depth 1 origin 22791a682e1d155da388f4f856cd7196cd9f2677
          git -C catalog_source checkout FETCH_HEAD

      - name: Install dependencies
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build embedded paint catalog
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python tools/build_paint_catalog.py "$env:GITHUB_WORKSPACE\catalog_source" app/data/paint_catalog.json
          python -c "import json, pathlib; d=json.loads(pathlib.Path('app/data/paint_catalog.json').read_text(encoding='utf-8')); assert len(d)>500; assert any(x['brand']=='Vallejo' and x['name']=='Ice Yellow' and x['code']=='70.858' and x['range_name']=='Model Color' for x in d); print('Catalog entries:', len(d))"

      - name: Run tests
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -v

      - name: Import smoke test
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -c "from app.constants import PAINT_BRANDS; from app.ui.dialogs.paint_dialog import PaintDialog; print(PAINT_BRANDS); print('Paint dialog import OK')"

      - name: Build CirosPaint.exe
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CirosPaint --add-data "app/data/paint_catalog.json;app/data" --add-data "THIRD_PARTY_NOTICES.txt;." main.py

      - name: Smoke-check executable exists
        shell: pwsh
        working-directory: build_source/CirosPaint
        run: |
          if (-not (Test-Path 'dist/CirosPaint.exe')) { throw 'CirosPaint.exe was not generated.' }
          Get-Item 'dist/CirosPaint.exe' | Format-List Name,Length,FullName

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-Windows-0.3
          path: build_source/CirosPaint/dist/CirosPaint.exe
          if-no-files-found: error
          retention-days: 30
