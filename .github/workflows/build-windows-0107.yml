name: Build Windows EXE 0.10.7

on:
  workflow_dispatch:
  push:
    branches: [build/verify-0.10.7]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild Ciros Paint and apply 0.10.7
        shell: pwsh
        run: |
          function Rebuild-Zip($pattern, $expectedCount, $output, $expectedHash) {
            $parts = Get-ChildItem $pattern | Sort-Object Name
            if ($parts.Count -ne $expectedCount) { throw "Unexpected chunk count for ${pattern}: $($parts.Count)" }
            $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
            [IO.File]::WriteAllBytes($output, [Convert]::FromBase64String($b64))
            $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLower()
            if ($expectedHash -and $hash -ne $expectedHash) { throw "Hash mismatch for ${output}: $hash" }
            Write-Host "Verified $output $hash"
          }

          Rebuild-Zip 'source/v0.6/chunks/part*.txt' 7 'source/CirosPaint_0.6.zip' '6e49c42e7d3ccfcf219ea24f164a8c436c7875eb56084318242dcb3171337b94'
          New-Item -ItemType Directory -Force build_source | Out-Null
          tar -xf source/CirosPaint_0.6.zip -C build_source

          Rebuild-Zip 'patches/v0.7/chunks/part*.txt' 5 'patches/CirosPaint_0.7.zip' 'aa0d1fc99b0770425081f0e18cbb399440cab77768ea36887d33038947721620'
          tar -xf patches/CirosPaint_0.7.zip -C build_source

          Rebuild-Zip 'patches/v0.8/chunks/part*.txt' 4 'patches/CirosPaint_0.8.zip' 'b30570d26f44aa0e5bf2727910396628e4ab8fc646ddacd49527991cde8d3b90'
          tar -xf patches/CirosPaint_0.8.zip -C build_source

          Rebuild-Zip 'patches/v0.8-artfix/chunks/part*.txt' 1 'patches/CirosPaint_0.8_artfix.zip' '3947092144570548e962b354ec0b7d6fa7b1f6416a2e0fbafa656b450945cbad'
          tar -xf patches/CirosPaint_0.8_artfix.zip -C build_source

          Rebuild-Zip 'patches/v0.8.1/chunks/part*.txt' 9 'patches/CirosPaint_0.8.1.zip' 'ed47500df62010bb9d9f5fb26d09b1174a84787eb80d50c3251db3d433d7ce02'
          tar -xf patches/CirosPaint_0.8.1.zip -C build_source

          python -c "from pathlib import Path; p=Path(r'patches/v0.8.2/CirosPaint_0.8.2.patch'); p.write_bytes(p.read_text(encoding='utf-8').encode('utf-8'))"
          git apply --directory=build_source patches/v0.8.2/CirosPaint_0.8.2.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply Ciros Paint 0.8.2 patch' }

          Rebuild-Zip 'patches/v0.8.3/chunks/part*.txt' 12 'patches/CirosPaint_0.8.3_overlay.zip' '185e2b09264544498de8da2d73e5f2c148b0a57b3fec6437bd7c22676b5b7dd9'
          tar -xf patches/CirosPaint_0.8.3_overlay.zip -C build_source
          Push-Location build_source
          python tools/apply_v083_metadata.py
          Pop-Location

          $dashboardPath = 'build_source/app/ui/pages/dashboard_page.py'
          $dashboard = Get-Content $dashboardPath -Raw
          $dashboard = $dashboard.Replace('Ciros Paint 0.8.3.3', 'Ciros Paint 0.8.3.1')
          Set-Content $dashboardPath $dashboard -Encoding utf8

          Rebuild-Zip 'patches/v0.9.0/code_overlay/part*.txt' 5 'patches/CirosPaint_0.9.0_code_overlay.zip' '7dd1878ef496db816313474e55312da775cd505a4da571c68c6a5767d62272f3'
          tar -xf patches/CirosPaint_0.9.0_code_overlay.zip -C build_source

          Copy-Item 'patches/v0.9.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.1/apply_v091.py build_source

          Copy-Item 'patches/v0.9.2/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.2/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.2/apply_v092.py build_source

          Copy-Item 'patches/v0.9.3/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.3/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.3/apply_v093.py build_source

          Copy-Item 'patches/v0.9.4/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.4/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.4/apply_v094.py build_source

          Copy-Item 'patches/v0.9.4.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.9.4.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.9.4.1/apply_v0941.py build_source

          $configPath = 'build_source/app/core/config.py'
          $config = Get-Content $configPath -Raw
          $config = $config.Replace('APP_VERSION = "0.9.4.1"', 'APP_VERSION = "0.9"')
          Set-Content $configPath $config -Encoding utf8

          Copy-Item 'patches/v0.10.1/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.1/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.1/apply_v0101.py build_source

          Copy-Item 'patches/v0.10.2/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.2/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.2/apply_v0102.py build_source

          Copy-Item 'patches/v0.10.3/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.3/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.3/apply_v0103.py build_source

          Copy-Item 'patches/v0.10.4/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.4/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.4/apply_v0104.py build_source

          Copy-Item 'patches/v0.10.5/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.5/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.5/apply_v0105.py build_source

          Copy-Item 'patches/v0.10.6/overlay/app/*' 'build_source/app' -Recurse -Force
          Copy-Item 'patches/v0.10.6/overlay/tests/*' 'build_source/tests' -Recurse -Force
          python patches/v0.10.6/apply_v0106.py build_source

          Rebuild-Zip 'patches/v0.10.7/chunks/part*.txt' 9 'patches/CirosPaint_0.10.7_overlay.zip' ''
          $overlayHash = (Get-FileHash 'patches/CirosPaint_0.10.7_overlay.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "CirosPaint_0.10.7_overlay.zip SHA256: $overlayHash"
          tar -xf patches/CirosPaint_0.10.7_overlay.zip -C build_source
          python patches/v0.10.7/apply_v0107.py build_source

          python -c "from pathlib import Path; ns={}; exec(Path('build_source/app/core/config.py').read_text(encoding='utf-8'), ns); assert ns['APP_VERSION']=='0.10.7'; req=Path('build_source/requirements.txt').read_text(encoding='utf-8'); assert 'google-genai>=2.3,<3' in req; g=Path('build_source/app/services/assistant_gemini_service.py').read_text(encoding='utf-8'); assert 'gemini-3.7-flash' in g and 'store=False' in g and 'thinking_level' in g and 'low' in g and 'total_input_tokens' in g and 'resolve_miniature_name' in g; a=Path('build_source/app/ui/pages/assistant_page.py').read_text(encoding='utf-8'); assert 'Consulta local · 0 tokens Gemini' in a and 'QCompleter' in a and 'setMarkdown' in a; l=Path('build_source/app/services/assistant_local_service.py').read_text(encoding='utf-8'); assert 'AssistantLocalService' in l; print('Ciros Paint 0.10.7 local-first assistant overlay verified')"

      - name: Set up paint catalog and dependencies
        shell: pwsh
        run: |
          git init catalog_source
          git -C catalog_source remote add origin https://github.com/Arcturus5404/miniature-paints.git
          git -C catalog_source fetch --depth 1 origin 22791a682e1d155da388f4f856cd7196cd9f2677
          git -C catalog_source checkout FETCH_HEAD
          New-Item -ItemType Directory -Force build_source/app/assets/brands | Out-Null
          Copy-Item catalog_source/logos/Vallejo.png build_source/app/assets/brands/vallejo.png
          Copy-Item catalog_source/logos/AK.png build_source/app/assets/brands/ak_interactive.png
          Copy-Item catalog_source/logos/Citadel_Colour.png build_source/app/assets/brands/citadel.png
          cd build_source
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -c "from google import genai; import google.genai; c=genai.Client(api_key='AQ.fake-ciros-paint'); assert callable(c.interactions.create); c.close(); print('google-genai', getattr(google.genai,'__version__','unknown'), 'Interactions API available')"

      - name: Build catalogs and verify assets
        shell: pwsh
        working-directory: build_source
        run: |
          $env:PYTHONPATH = (Get-Location).Path
          python tools/build_paint_catalog.py "$env:GITHUB_WORKSPACE\catalog_source" app/data/paint_catalog.json
          python tools/download_miniature_assets.py
          python -c "import json,pathlib; p=json.loads(pathlib.Path('app/data/paint_catalog.json').read_text(encoding='utf-8')); m=json.loads(pathlib.Path('app/data/miniature_catalog.json').read_text(encoding='utf-8')); assert len(p)>500; assert all(isinstance(x.get('lab'),list) and len(x['lab'])==3 for x in p); assert m.get('catalog_revision')=='0.8.1'; assert sum(len(f['units']) for g in m['games'] for f in g['factions'])>500; print('Catalogs and Lab metadata OK')"
          if (!(Test-Path 'app/assets/favorites/miniatures.svg')) { throw 'Miniaturas favorites banner missing' }
          if (!(Test-Path 'app/assets/favorites/modeling_general.svg')) { throw 'Modelismo general favorites banner missing' }

      - name: Run tests
        shell: pwsh
        working-directory: build_source
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONPATH = (Get-Location).Path
          python -m unittest discover -s tests -v

      - name: Functional assistant UI smoke test
        shell: pwsh
        working-directory: build_source
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PYTHONPATH = (Get-Location).Path
          python -c "from PySide6.QtWidgets import QApplication,QLineEdit; app=QApplication([]); from app.core.config import APP_VERSION; assert APP_VERSION=='0.10.7'; from app.ui.pages.assistant_page import AssistantPage; p=AssistantPage(); assert p.send_button.text()=='Enviar' and not p.busy; from app.ui.pages.settings_page import SettingsPage; s=SettingsPage(); assert s.gemini_api_key_input.echoMode()==QLineEdit.Password and s.gemini_test_button.text()=='Comprobar conexión'; from app.services.assistant_gemini_service import GeminiAssistantService; tools=GeminiAssistantService._gemini_tool_declarations(); assert len(tools)>=8 and all(t['type']=='function' for t in tools); p.close(); s.close(); print('Ciros Paint 0.10.7 assistant smoke test OK')"

      - name: Build CirosPaint_0.10.7.exe
        shell: pwsh
        working-directory: build_source
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CirosPaint --collect-all google.genai --add-data "app/data/paint_catalog.json;app/data" --add-data "app/data/miniature_catalog.json;app/data" --add-data "app/assets/brands;app/assets/brands" --add-data "app/assets/miniatures;app/assets/miniatures" --add-data "app/assets/favorites;app/assets/favorites" --add-data "THIRD_PARTY_NOTICES.txt;." --add-data "MINIATURE_ASSET_SOURCES.md;." main.py
          if (!(Test-Path 'dist/CirosPaint.exe')) { throw 'CirosPaint.exe was not generated' }
          Move-Item 'dist/CirosPaint.exe' 'dist/CirosPaint_0.10.7.exe'
          if (!(Test-Path 'dist/CirosPaint_0.10.7.exe')) { throw 'CirosPaint_0.10.7.exe was not generated' }
          Get-Item dist/CirosPaint_0.10.7.exe | Format-List Name,Length,FullName
          $exeHash = (Get-FileHash 'dist/CirosPaint_0.10.7.exe' -Algorithm SHA256).Hash.ToLower()
          Write-Host "CirosPaint_0.10.7.exe SHA256: $exeHash"

      - uses: actions/upload-artifact@v4
        with:
          name: CirosPaint-Windows-0.10.7
          path: build_source/dist/CirosPaint_0.10.7.exe
          if-no-files-found: error
          retention-days: 30
